name: CI

# PSScriptAnalyzer + Pester on every push and pull request, under Windows
# PowerShell 5.1 (the version Scy targets). Same checks as running
#   powershell -NoProfile -File Tests\Invoke-ScyChecks.ps1
# locally.

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester and PSScriptAnalyzer
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force | Out-Null
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.9.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force

      - name: Run checks
        run: .\Tests\Invoke-ScyChecks.ps1
